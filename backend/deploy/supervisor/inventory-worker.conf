; Adjust /srv/brickventory and the service account for your deployment.
[program:brickventory-imports]
command=php /srv/brickventory/backend/bin/console messenger:consume inventory_imports --env=prod --time-limit=3600 --memory-limit=256M --keepalive=30
user=www-data
directory=/srv/brickventory/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/srv/brickventory/backend/var/log/import-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
